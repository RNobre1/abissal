<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Favicon moderno do Abissal (transparente, dark/light via prefers-color-scheme). Detectado pelo Next 16 por convenção. -->
  <style>
    .strata { stroke: #f8f5ef; }
    @media (prefers-color-scheme: light) { .strata { stroke: #15151c; } }
  </style>
  <g class="strata" fill="none" stroke-width="3.6" stroke-linecap="round">
    <line x1="18" y1="26" x2="82" y2="26" stroke-opacity="0.95"/>
    <line x1="23" y1="40" x2="77" y2="40" stroke-opacity="0.75"/>
    <line x1="28" y1="54" x2="72" y2="54" stroke-opacity="0.55"/>
    <line x1="33" y1="68" x2="67" y2="68" stroke-opacity="0.4"/>
  </g>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#d43535" flood-opacity="0.85" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="80" r="4.2" fill="#d43535" filter="url(#glow)"/>
</svg>
