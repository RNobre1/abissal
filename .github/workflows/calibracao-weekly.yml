name: calibracao-weekly

# 12:00 UTC todo domingo — refit dos parâmetros de liga (MoM) e da
# calibração isotônica. 12:00 UTC roda DEPOIS do scrape (10:00) + reconcilers
# + ai-reco (10:45), então pega os jogos de sábado já resolvidos no scrape
# de domingo. Cadência semanal (era mensal): na fase atual o dataset cresce
# rápido — em 6 dias a isotônica foi de n=538/4 métricas → n=607/5 (ganhou
# btts) e os fits por liga se movem bastante (14 ligas elegíveis, muitas em
# n=20-26 flag low_confidence; uma a n=20 vira n=27 numa semana = +35% dado).
# Refit semanal incorpora isso muito mais cedo. As travas n>=20 (por liga) e
# o pool da isotônica autoprotegem contra amostra fina. Reavaliar a cadência
# (voltar pra mensal) quando o conjunto de ligas qualificadas estabilizar.
# É refit MECÂNICO data-driven — NÃO mexe em prompt/modelo (decisão manual,
# por evidência, nunca por calendário — ver lição B24). Manual via workflow_dispatch.
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

concurrency:
  group: calibracao-weekly
  cancel-in-progress: false

jobs:
  calibracao:
    runs-on: ubuntu-latest
    # 20min era apertado demais: de 05/07 a 26/07 TODA execução foi cancelada
    # no timeout com o `Seed challenger` consumindo 18 dos 20 minutos, e o
    # `Compare` nunca rodou. O refit em blocos (walk-forward refitEvery) cortou
    # o custo desse step; 30min dá folga real em vez de empurrar o problema.
    timeout-minutes: 30
    steps:
      # read-only (não dá git push) → persist-credentials:false (least-privilege,
      # item 10 do optimizing-github-actions).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: Fit league parameters (MoM por liga)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/fit-league-parameters.ts

      - name: Fit isotonic calibration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/fit-isotonic.ts

      # Calibração de DISTRIBUIÇÃO (k por stat — corners/cards/sot). Refit
      # mecânico data-driven (B24) que corrige o viés de média dos mercados de
      # contagem. Coexiste com a isotônica (prioridade curva → k → raw).
      - name: Fit distribution calibration (k)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/fit-dist.ts

      # Calibração de PLACAR (item 1 / B28): mede a acurácia de placar e fita
      # (T, δ) que recalibram a forma do top_scorelines (achata o pico + deflaciona
      # empate). Display-only, validado out-of-sample, NÃO bumpa model_version.
      - name: Fit scoreline calibration (T, δ)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/fit-scoreline-cal.ts

      # Arena champion-challenger (ADR-011). Primeiro SEMEIA as predições do
      # Temperature scaling por mercado (1x2/over25/btts). A sim ESTICA as
      # probabilidades e um T corrige o viés monotônico. Promovido em 28/07
      # após vencer a arena (n=7290, p<.001) — lição B45. Refit MECÂNICO
      # data-driven, como os demais: não mexe em prompt/modelo (B24).
      - name: Fit temperature scaling (T por mercado)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/fit-temperature.ts

      # champion ativo (backfill idempotente do fixture_simulations), depois
      # COMPARA via log-loss + paired bootstrap deflacionado. Ambos degradam
      # gracioso se a migration 0049 não estiver aplicada (exit 0 com mensagem).
      - name: Seed champion predictions (arena)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/seed-model-predictions.ts

      # 1º challenger: cards via Conway-Maxwell-Poisson (ν fitado held-out).
      # Nas NOSSAS ligas os cartões são OVER-dispersos (ν≈0.7) — refit semanal.
      - name: Seed challenger (cards CMP)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/seed-challenger-cards-cmp.ts

      # 2º challenger: temperature scaling nas probs de mercado (1x2/over25/
      # btts). A sim ESTICA as probabilidades — subconfiante embaixo,
      # superconfiante em cima — e um T por mercado corrige esse viés
      # monotônico. Walk-forward, cobertura total, shadow.
      - name: Seed challenger (temperature scaling)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/seed-challenger-temperature.ts

      # 3º challenger: cartões com o PERFIL DO ÁRBITRO (média em cartões +
      # ν por árbitro). O achado de 28/07 é que a dispersão dos cartões varia
      # POR ÁRBITRO (45 over / 42 sub / 31 ≈Poisson) — fitar ν global fita a
      # média de duas populações opostas, o que explica o CMP global
      # inconclusivo (B35-B37). FORWARD-ONLY: o detail_json tem retenção de
      # ~4 dias, então rodar toda semana é o que acumula amostra.
      - name: Seed challenger (referee cards)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/seed-challenger-referee-cards.ts

      - name: Compare champion vs challengers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/calibracao/compare-models.ts

      # Healthchecks.io ping opcional — silencioso se o secret não estiver
      # configurado. Step roda fora do shell normal pra evitar `-e {0}` cortar
      # o `if:` (env só populado quando o secret existe).
      - name: Ping healthchecks (success)
        if: success() && env.HEALTHCHECKS_CALIBRATE_URL != ''
        env:
          HEALTHCHECKS_CALIBRATE_URL: ${{ secrets.HEALTHCHECKS_CALIBRATE_URL }}
        run: curl -fsS --retry 3 "$HEALTHCHECKS_CALIBRATE_URL" || true

      - name: Ping healthchecks (fail)
        if: failure() && env.HEALTHCHECKS_CALIBRATE_URL != ''
        env:
          HEALTHCHECKS_CALIBRATE_URL: ${{ secrets.HEALTHCHECKS_CALIBRATE_URL }}
        run: curl -fsS --retry 3 "${HEALTHCHECKS_CALIBRATE_URL}/fail" || true

  # Rede de segurança contra TIMEOUT do job acima.
  #
  # Quando `timeout-minutes` estoura, o GitHub cancela o job inteiro — e os
  # steps de ping, mesmo os condicionais, são pulados junto. Foi exatamente o
  # que aconteceu de 05/07 a 26/07: quatro execuções seguidas cortadas no
  # timeout, `Compare` nunca rodou, e o Healthchecks.io nunca soube porque o
  # step de /fail (`if: failure()`) não dispara em cancelamento.
  #
  # Um job separado com `if: always()` sobrevive ao cancelamento do outro e
  # cobre os três desfechos ruins: failure, cancelled e skipped.
  notify-failure:
    needs: calibracao
    if: always() && needs.calibracao.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping healthchecks (fail — cobre timeout/cancelamento)
        env:
          HEALTHCHECKS_CALIBRATE_URL: ${{ secrets.HEALTHCHECKS_CALIBRATE_URL }}
          RESULT: ${{ needs.calibracao.result }}
        run: |
          set -euo pipefail
          echo "calibracao terminou como: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${HEALTHCHECKS_CALIBRATE_URL:-}" ]; then
            curl -fsS --retry 3 "${HEALTHCHECKS_CALIBRATE_URL}/fail" || true
          else
            echo "HEALTHCHECKS_CALIBRATE_URL não configurado — sem ping." >> "$GITHUB_STEP_SUMMARY"
          fi
