name: scrape-daily

on:
  # 07:00 BRT (UTC-3) = 10:00 UTC. Adamchoi fixtures for the day are
  # already populated by then; running pre-noon BRT keeps the data fresh
  # before the user typically opens the app.
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts/scraper
    steps:
      - uses: actions/checkout@v4

      - name: install mise (ruby 4.0.3 + node 22)
        uses: jdx/mise-action@v2
        with:
          working_directory: scripts/scraper

      - name: cache bundle
        uses: actions/cache@v4
        with:
          path: scripts/scraper/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('scripts/scraper/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: bundle install
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: run scraper
        env:
          DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
          ADAMCHOI_API_TOKEN: ${{ secrets.ADAMCHOI_API_TOKEN }}
          SCRAPER_LEAGUE_SLUGS: ${{ vars.SCRAPER_LEAGUE_SLUGS }}
          SCRAPER_DETAIL_CONCURRENCY: "4"
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          # A4 — silent-death detector: check SEPARADO em healthchecks.io para
          # alarmar especificamente quando o AI Recommender cria 0 recos em dia
          # com > 10 fixtures pendentes. Setup manual: criar check no painel da
          # healthchecks.io e `gh secret set HEALTHCHECKS_AI_RECO_URL`. Vazio =
          # degradação graciosa (log no stderr, sem ping HTTP).
          HEALTHCHECKS_AI_RECO_URL: ${{ secrets.HEALTHCHECKS_AI_RECO_URL }}
          # IA-2 Recomendador (Wave 2): orchestrator chama AiRecommenderRunner
          # após reconcilers. Sem essas vars, runner aborta gracioso (não fatal).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_RECO_MODEL: ${{ vars.AI_RECO_MODEL }}
          AI_RECO_BANKROLL: ${{ vars.AI_RECO_BANKROLL }}
        run: bundle exec bin/scrape
