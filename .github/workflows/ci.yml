name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test

      - name: next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build-only
        run: pnpm build

  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres 17 service container para os specs de integração DB do scraper
    # (persister, league_baseline, simulation_reconciler, orchestrator).
    # spec/db/db_helper.rb cria os roles Supabase (anon/authenticated/service_role)
    # e aplica as migrations fixtures-domain (0007+) na primeira conexão.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adam
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: adam_stats_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: scripts/scraper
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install mise (ruby 4.0.3)
        uses: jdx/mise-action@v2
        with:
          working_directory: scripts/scraper

      - name: cache bundle
        uses: actions/cache@v4
        with:
          path: scripts/scraper/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('scripts/scraper/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: bundle install
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: rspec
        env:
          # Aponta para o service container acima (localhost porque o runner
          # acessa via port-forward). DATABASE_URL_TEST é o override lido por
          # spec/db/db_helper.rb; DATABASE_URL é setado pelos próprios specs
          # de integração (persister/league_baseline) antes de conectar.
          DATABASE_URL_TEST: postgres://adam:senha@localhost:5433/adam_stats_test
        run: bundle exec rspec

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # Build de produção com a URL Supabase REAL inlinada (NEXT_PUBLIC_* é
      # resolvido em build-time). Os E2E leem dados reais (fixtures/sim) por trás
      # da auth, então precisam do projeto de produção.
      - name: build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build

      # Playwright sobe `pnpm start` (webServer) e roda nos 2 projetos
      # (desktop-chromium + mobile-s23fe). O teste de OCR ao vivo (custa $) fica
      # de fora; o login usa o usuário E2E dedicado via GH secrets.
      - name: e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # Dummy: o OCR usa o mock OpenRouter (OPENROUTER_BASE_URL no webServer);
          # gemini-vision só exige a key setada, o mock ignora o valor.
          OPENROUTER_API_KEY: sk-e2e-mock
        run: pnpm exec playwright test --grep-invert "live OCR"

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
