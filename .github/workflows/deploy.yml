name: deploy

on:
  # Dispara somente após o CI verde em main — nunca em paralelo com ele.
  # O checkout usa o SHA exato que o CI validou (head_sha do workflow_run),
  # garantindo que o artefato deployado é idêntico ao testado.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  # Escape manual: permite deploy forçado sem esperar o workflow_run.
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # workflow_run: só prossegue se o CI passou em main.
    # workflow_dispatch: if condition é sempre verdadeira (github.event_name != 'workflow_run').
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          # Em workflow_run, faz checkout do SHA exato que o CI testou.
          # Em workflow_dispatch, head_sha não existe — usa o ref padrão (main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build for cloudflare workers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: pnpm cf:build

      - name: sync worker secrets
        # Os GH secrets são a fonte única dos secrets de RUNTIME do Worker.
        # Sem este passo, rotacionar uma chave no GitHub não muda nada em
        # produção (incidente 30/07: OpenRouter 401 "User not found" no
        # on-demand e no OCR — a chave nova só existia no Actions).
        # jq lê de env (nunca ecoa valor em log).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADAMCHOI_API_TOKEN: ${{ secrets.ADAMCHOI_API_TOKEN }}
        run: |
          jq -n '{
            OPENROUTER_API_KEY: env.OPENROUTER_API_KEY,
            SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
            ADAMCHOI_API_TOKEN: env.ADAMCHOI_API_TOKEN
          }' | pnpm exec wrangler secret bulk

      - name: deploy to cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
