name: api-football-snapshot

# Captura schema da API-Football semanalmente.
# Detecta breaking changes (campos renomeados, removidos) via SHA256 dos JSONs.
#
# Custo: ~12 requests/run × 1 run/semana = 48 req/mês (~1.6% do free tier mensal).

on:
  schedule:
    - cron: "0 12 * * 1"  # toda segunda 12:00 UTC = 09:00 BRT
  workflow_dispatch: {}

concurrency:
  group: api-football-snapshot
  cancel-in-progress: false

permissions:
  contents: write  # precisa pra commit do snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: install deps
        run: pnpm install --frozen-lockfile

      - name: capture snapshot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_BASE_URL: ${{ secrets.API_FOOTBALL_BASE_URL }}
        run: pnpm exec tsx scripts/external-apis/snapshot-api-football.ts

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/external-apis/api-football/samples/)" ]; then
            DATE=$(date -u +%Y-%m-%d)
            git add docs/external-apis/api-football/samples/"$DATE"
            git commit -m "chore(api-football): snapshot semanal $DATE"
            git push
          else
            echo "no changes in snapshot — skipping commit"
          fi
