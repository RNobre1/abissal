<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- Abissal — versão maskable (mark dentro da safe-zone ~70%, fundo preenche tudo) -->
  <rect width="100" height="100" fill="#09090f"/>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feFlood flood-color="#d43535" flood-opacity="0.9" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(15 15) scale(0.7)">
    <g fill="none" stroke="#f8f5ef" stroke-width="3.2" stroke-linecap="round">
      <line x1="18" y1="26" x2="82" y2="26" stroke-opacity="0.95"/>
      <line x1="23" y1="40" x2="77" y2="40" stroke-opacity="0.747"/>
      <line x1="28" y1="54" x2="72" y2="54" stroke-opacity="0.543"/>
      <line x1="33" y1="68" x2="67" y2="68" stroke-opacity="0.34"/>
    </g>
    <circle cx="50" cy="80" r="4" fill="#d43535" filter="url(#glow)"/>
  </g>
</svg>
